[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "notification-router"
version = "0.1.0"
description = "Milestone 1 deterministic message-dataset diagnostics"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
notification-router = "notification_router.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["notification_router*"]
